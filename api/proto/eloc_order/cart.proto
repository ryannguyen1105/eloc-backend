syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ryannguyen1105/eloc-backend/services/eloc_order/pb";

message Cart {
  int64                     user_id    = 1;
  int64                     product_id = 2;
  int64                     quantity   = 3;
  google.protobuf.Timestamp created_at = 4;
}
