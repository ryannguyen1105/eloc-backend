syntax = "proto3";

package pb;

import "eloc_order/cart.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ryannguyen1105/eloc-backend/services/eloc_order/pb";

message UpdateCartQuantityRequest {
  int64 user_id    = 1;
  int64 product_id = 2;
  int64 quantity   = 3;
}

message UpdateCartQuantityResponse {
  Cart                      cart       = 1;
  google.protobuf.Timestamp updated_at = 2;
}