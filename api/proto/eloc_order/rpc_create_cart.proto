syntax = "proto3";

package pb;

import "eloc_order/cart.proto";

option go_package = "github.com/ryannguyen1105/eloc-backend/services/eloc_order/pb";

message CreateCartRequest {
  int64 user_id    = 1;
  int64 product_id = 2;
  int64 quantity   = 3;
}

message CreateCartResponse {
  Cart cart = 1;
}
