syntax = "proto3";

package pb;

import "google/api/annotations.proto";

import "eloc_auth/rpc_create_user.proto";
import "eloc_auth/rpc_login_user.proto";

option go_package = "github.com/ryannguyen1105/eloc-backend/services/eloc_auth/pb";

service Eloc_Auth {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/create_user"
      body: "*"
    };
  }
  rpc LoginUser (LoginUserRequest) returns (LoginUserResponse) {
    option (google.api.http) = {
      post: "/v1/login_user"
      body: "*"
    };
  }
}