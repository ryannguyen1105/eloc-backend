name: Deploy Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

# Eloc_Auth_Service

  auth_service:
    name: Auth Service (Test & Deploy)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/eloc_auth

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: eloc_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code into Go module directory
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v4
        with:
          go-version: ^1.26.3
        id: go

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate
          which migrate

      - name: Run migrations
        run: make migrateup

      - name: Test
        run: make test

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: services/eloc_auth
          push: true
          tags: tainguyen2812/eloc_auth:latest

      - name: Trigger Render Deploy
        run: curl -f -X POST ${{ secrets.RENDER_AUTH_DEPLOY_HOOK_URL }}